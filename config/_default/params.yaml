features:
  comment:
    provider: 'giscus'
  disqus:
    shortname: ''
    show_count: 
  commento:
    url: 
    giscus:
      repo: "mohammedovich/mohammedovich.github.io"
      repoID: "R_kgDOPXTuNA"
